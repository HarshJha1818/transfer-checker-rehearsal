<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="900" fill="#f6f8fa"/>
  <rect x="40" y="30" width="820" height="840" rx="10" fill="#ffffff" stroke="#d6dde5"/>

  <text x="70" y="82" font-size="28" font-weight="700" fill="#1b2a41">Transfer Credit Gap Checker</text>
  <text x="70" y="110" font-size="15" fill="#5b6b7f">See which of your Florida college courses count toward your target major, and why.</text>

  <rect x="70" y="135" width="370" height="110" rx="8" fill="#f6f8fa" stroke="#c3ccd6" stroke-dasharray="6 4"/>
  <text x="90" y="165" font-size="15" font-weight="600" fill="#1b2a41">Your transcript</text>
  <rect x="90" y="182" width="330" height="44" rx="6" fill="#ffffff" stroke="#d6dde5"/>
  <text x="108" y="210" font-size="14" fill="#1b2a41">transcript_A.pdf</text>
  <text x="402" y="210" font-size="14" text-anchor="end" fill="#2e7d5b">✓ read</text>

  <rect x="460" y="135" width="370" height="110" rx="8" fill="#f6f8fa" stroke="#c3ccd6" stroke-dasharray="6 4"/>
  <text x="480" y="165" font-size="15" font-weight="600" fill="#1b2a41">Target major requirements</text>
  <rect x="480" y="182" width="330" height="44" rx="6" fill="#ffffff" stroke="#d6dde5"/>
  <text x="498" y="210" font-size="14" fill="#1b2a41">Data Science BS: 7 courses found</text>

  <rect x="330" y="268" width="240" height="46" rx="8" fill="#1b2a41"/>
  <text x="450" y="297" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">Check my transfer</text>

  <!-- Transfers -->
  <rect x="70" y="340" width="243" height="290" rx="8" fill="#eef7f2" stroke="#b9dcc8"/>
  <text x="90" y="370" font-size="16" font-weight="700" fill="#2e7d5b">Transfers (3)</text>
  <g font-size="13">
    <rect x="86" y="386" width="211" height="62" rx="6" fill="#ffffff" stroke="#cfe6d9"/>
    <text x="100" y="410" font-weight="600" fill="#1b2a41">ENC 1101 → ENC 2101</text>
    <text x="100" y="432" fill="#5b6b7f">Same prefix + last 3 digits</text>
    <rect x="86" y="458" width="211" height="62" rx="6" fill="#ffffff" stroke="#cfe6d9"/>
    <text x="100" y="482" font-weight="600" fill="#1b2a41">MAC 2311 → MAC 2311</text>
    <text x="100" y="504" fill="#5b6b7f">Exact match</text>
    <rect x="86" y="530" width="211" height="62" rx="6" fill="#ffffff" stroke="#cfe6d9"/>
    <text x="100" y="554" font-weight="600" fill="#1b2a41">STA 2023 → STA 2023</text>
    <text x="100" y="576" fill="#5b6b7f">Exact match</text>
  </g>

  <!-- Still needed -->
  <rect x="328" y="340" width="244" height="290" rx="8" fill="#f1f3f6" stroke="#cdd4dc"/>
  <text x="348" y="370" font-size="16" font-weight="700" fill="#44546a">Still needed (2)</text>
  <g font-size="13">
    <rect x="344" y="386" width="212" height="62" rx="6" fill="#ffffff" stroke="#dde2e8"/>
    <text x="358" y="410" font-weight="600" fill="#1b2a41">COP 3530</text>
    <text x="358" y="432" font-size="12" fill="#5b6b7f">No matching course, 3 credits</text>
    <rect x="344" y="458" width="212" height="62" rx="6" fill="#ffffff" stroke="#dde2e8"/>
    <text x="358" y="482" font-weight="600" fill="#1b2a41">MAC 2312</text>
    <text x="358" y="504" font-size="12" fill="#5b6b7f">No matching course, 4 credits</text>
  </g>

  <!-- Advisor -->
  <rect x="587" y="340" width="243" height="290" rx="8" fill="#fdf6e9" stroke="#ecd4a4"/>
  <text x="603" y="370" font-size="14.5" font-weight="700" fill="#a0661a">Check with an advisor (2)</text>
  <g font-size="13">
    <rect x="603" y="386" width="211" height="62" rx="6" fill="#ffffff" stroke="#f0dfbb"/>
    <text x="617" y="410" font-weight="600" fill="#1b2a41">BSC 2010C vs BSC 2010</text>
    <text x="617" y="432" fill="#5b6b7f">Lab suffix differs</text>
    <rect x="603" y="458" width="211" height="62" rx="6" fill="#ffffff" stroke="#f0dfbb"/>
    <text x="617" y="482" font-weight="600" fill="#1b2a41">ENC 1102</text>
    <text x="617" y="504" fill="#5b6b7f">Grade W (withdrawn)</text>
  </g>

  <!-- Totals -->
  <rect x="70" y="655" width="370" height="84" rx="8" fill="#ffffff" stroke="#d6dde5"/>
  <text x="90" y="705" font-size="34" font-weight="700" fill="#2e7d5b">10</text>
  <text x="150" y="703" font-size="15" fill="#44546a">credits apply</text>
  <rect x="460" y="655" width="370" height="84" rx="8" fill="#ffffff" stroke="#d6dde5"/>
  <text x="480" y="705" font-size="34" font-weight="700" fill="#44546a">7</text>
  <text x="520" y="703" font-size="15" fill="#44546a">credits still needed</text>

  <!-- Reminder -->
  <rect x="70" y="765" width="760" height="56" rx="8" fill="#eef3fb" stroke="#c9d7ee"/>
  <text x="90" y="799" font-size="14" fill="#1b2a41">Confirm with your academic advisor before registering. This is not an official degree audit.</text>
</svg>
